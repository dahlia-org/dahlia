name: Server CI

on:
  pull_request:
    paths:
      - ".github/workflows/server-ci.yml"
      - "apps/server/**"
      - "deploy/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/server-ci.yml"
      - "apps/server/**"
      - "deploy/**"

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-validation:
    name: Server Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: dahlia
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/server/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap non-privileged PostgreSQL application role
        run: |
          psql -h 127.0.0.1 -U postgres -d dahlia -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION vector;
          CREATE ROLE dahlia LOGIN NOBYPASSRLS;
          GRANT CONNECT, CREATE ON DATABASE dahlia TO dahlia;
          CREATE DATABASE dahlia_header OWNER dahlia;
          SQL

      - name: Validate Server application
        run: pnpm check

      - name: Validate shared PostgreSQL migration in header mode
        run: |
          pnpm db:migrate
          psql "$DAHLIA_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regnamespace('auth') IS NULL THEN
              RAISE EXCEPTION 'header migration did not create auth schema';
            END IF;
            IF to_regclass('auth.user') IS NULL THEN
              RAISE EXCEPTION 'header migration did not create auth user table';
            END IF;
            IF to_regclass('drizzle.__dahlia_auth_migrations') IS NULL THEN
              RAISE EXCEPTION 'header migration did not create auth ledger';
            END IF;
            IF to_regclass('drizzle.__dahlia_server_migrations') IS NULL THEN
              RAISE EXCEPTION 'header migration did not create application ledger';
            END IF;
          END
          $$;
          SQL
        env:
          DAHLIA_AUTH_TYPE: header
          DAHLIA_DATABASE_TYPE: postgres
          DAHLIA_DATABASE_URL: postgresql://dahlia@127.0.0.1:5432/dahlia_header

      - name: Validate PostgreSQL migration
        run: pnpm db:migrate
        env:
          DAHLIA_AUTH_TYPE: accounts
          DAHLIA_DATABASE_TYPE: postgres
          DAHLIA_DATABASE_URL: postgresql://dahlia@127.0.0.1:5432/dahlia
          DAHLIA_APP_URL: https://dahlia.example
          BETTER_AUTH_SECRET: test-only-better-auth-secret-value
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          DAHLIA_OAUTH_REDIRECT_URIS: http://127.0.0.1:1455/oauth/callback,http://localhost:8020
          DAHLIA_AI_BACKEND: databricks
          DATABRICKS_HOST: https://workspace.example.databricks.com
          DATABRICKS_MODEL_SCHEMA: dahlia.ai
          DATABRICKS_CLIENT_ID: test-app-client-id
          DATABRICKS_CLIENT_SECRET: test-app-client-secret
          DAHLIA_SEARCH_EMBEDDING_MODEL: test-embedding-model
          DAHLIA_SEARCH_EMBEDDING_DIMENSIONS: 32

      - name: Validate PostgreSQL retention upgrade
        run: |
          psql postgresql://postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE dahlia_retention_upgrade OWNER dahlia'
          pnpm exec vitest run tests/postgres-retention-upgrade.test.ts
        env:
          TEST_MIGRATION_DATABASE_URL: postgresql://dahlia@127.0.0.1:5432/dahlia_retention_upgrade

      - name: Validate PostgreSQL application store
        run: pnpm exec vitest run tests/postgres-store.test.ts tests/postgres-retention.test.ts tests/sync-sqlite.test.ts
        env:
          TEST_DATABASE_URL: postgresql://dahlia@127.0.0.1:5432/dahlia

      - name: Validate SQLite migration
        run: pnpm db:migrate
        env:
          DAHLIA_AUTH_TYPE: accounts
          DAHLIA_DATABASE_TYPE: sqlite
          DAHLIA_DATABASE_URL: file:/tmp/dahlia-auth.sqlite
          DAHLIA_APP_URL: http://localhost:5173
          BETTER_AUTH_SECRET: test-only-better-auth-secret-value
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          DAHLIA_OAUTH_REDIRECT_URIS: http://127.0.0.1:1455/oauth/callback,http://localhost:8020

      - name: Validate D1 auth migration
        run: pnpm db:migrate:d1:local
