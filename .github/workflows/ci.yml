name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A cancelled run never saves its build cache, so only supersede pushes on a pull request.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  lint:
    name: Lint
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show toolchain
        id: toolchain
        run: |
          toolchain="$(xcodebuild -version; swift --version)"
          echo "$toolchain"
          toolchain_hash="$(printf '%s' "$toolchain" | shasum -a 256 | awk '{ print $1 }')"
          echo "hash=$toolchain_hash" >> "$GITHUB_OUTPUT"

      - name: Cache BuildTools
        uses: actions/cache@v5
        with:
          path: BuildTools/.build
          key: buildtools-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('BuildTools/Package.resolved') }}

      - name: Install lint tools
        run: brew install swiftlint

      - name: Run lint
        run: ./scripts/lint.sh

      - name: Test release scripts
        run: ./scripts/test-release-scripts.sh

  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show toolchain
        id: toolchain
        run: |
          toolchain="$(xcodebuild -version; swift --version)"
          echo "$toolchain"
          toolchain_hash="$(printf '%s' "$toolchain" | shasum -a 256 | awk '{ print $1 }')"
          echo "hash=$toolchain_hash" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}-

      - name: Build package and tests
        run: swift build --build-tests

      - name: Run unit tests
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test-output.log

      - name: Verify tests executed
        run: grep -Eq "Test run with [1-9][0-9]* tests" test-output.log

      # Saving only on main keeps pull requests from evicting each other: the cache entry is
      # ~1.5 GB and the repository limit is 10 GB. `always()` also saves a timed-out run, so a
      # slow build cannot compound into a colder cache on the next run.
      - name: Save SwiftPM build cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
