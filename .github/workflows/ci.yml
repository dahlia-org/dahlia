name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  lint:
    name: Lint
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show toolchain
        id: toolchain
        run: |
          toolchain="$(xcodebuild -version; swift --version)"
          echo "$toolchain"
          toolchain_hash="$(printf '%s' "$toolchain" | shasum -a 256 | awk '{ print $1 }')"
          echo "hash=$toolchain_hash" >> "$GITHUB_OUTPUT"

      - name: Cache BuildTools
        uses: actions/cache@v5
        with:
          path: apps/desktop/BuildTools/.build
          key: buildtools-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('apps/desktop/BuildTools/Package.resolved') }}

      - name: Install lint tools
        run: brew install swiftlint

      - name: Run lint
        run: ./scripts/lint.sh

      - name: Test release scripts
        run: ./scripts/test-release-scripts.sh

  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show toolchain
        id: toolchain
        run: |
          toolchain="$(xcodebuild -version; swift --version)"
          echo "$toolchain"
          toolchain_hash="$(printf '%s' "$toolchain" | shasum -a 256 | awk '{ print $1 }')"
          echo "hash=$toolchain_hash" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}-

      - name: Build package and tests
        run: swift build --build-tests

      - name: Run unit tests
        run: |
          set -o pipefail
          swift test --skip-build --experimental-maximum-parallelization-width 4 -q 2>&1 | tee test-output.log

      - name: Verify tests executed
        run: grep -Eq "Test run with [1-9][0-9]* tests" test-output.log

      # Each entry is ~1.5 GB against a 10 GB repository limit. Pull requests restore the latest
      # main cache but do not create short-lived entries that evict it.
      - name: Save SwiftPM build cache
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
