name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  cloud:
    name: Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dahlia
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: dahlia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dahlia"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate cloud application
        run: pnpm check

      - name: Validate PostgreSQL migration
        run: pnpm db:migrate
        env:
          DAHLIA_RUNTIME: custom
          DAHLIA_AUTH_PROVIDER: accounts
          DAHLIA_AUTH_DATABASE: postgres
          DAHLIA_BASE_URL: https://dahlia.example
          DATABASE_URL: postgresql://dahlia@127.0.0.1:5432/dahlia
          BETTER_AUTH_SECRET: test-only-better-auth-secret-value
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          DAHLIA_OAUTH_REDIRECT_URIS: http://127.0.0.1:1455/oauth/callback

      - name: Validate PostgreSQL application store
        run: pnpm --filter @dahlia/cloud exec vitest run tests/postgres-store.test.ts
        env:
          TEST_DATABASE_URL: postgresql://dahlia@127.0.0.1:5432/dahlia

      - name: Validate SQLite migration
        run: pnpm db:migrate
        env:
          DAHLIA_RUNTIME: custom
          DAHLIA_AUTH_PROVIDER: accounts
          DAHLIA_AUTH_DATABASE: sqlite
          DAHLIA_AUTH_SQLITE_PATH: /tmp/dahlia-auth.sqlite
          DAHLIA_BASE_URL: http://localhost:5173
          BETTER_AUTH_SECRET: test-only-better-auth-secret-value
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          DAHLIA_OAUTH_REDIRECT_URIS: http://127.0.0.1:1455/oauth/callback

      - name: Validate D1 auth migration
        run: pnpm db:migrate:d1:local

  lint:
    name: Lint
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show toolchain
        id: toolchain
        run: |
          toolchain="$(xcodebuild -version; swift --version)"
          echo "$toolchain"
          toolchain_hash="$(printf '%s' "$toolchain" | shasum -a 256 | awk '{ print $1 }')"
          echo "hash=$toolchain_hash" >> "$GITHUB_OUTPUT"

      - name: Cache BuildTools
        uses: actions/cache@v5
        with:
          path: BuildTools/.build
          key: buildtools-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('BuildTools/Package.resolved') }}

      - name: Install lint tools
        run: brew install swiftlint

      - name: Run lint
        run: ./scripts/lint.sh

      - name: Test release scripts
        run: ./scripts/test-release-scripts.sh

  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show toolchain
        id: toolchain
        run: |
          toolchain="$(xcodebuild -version; swift --version)"
          echo "$toolchain"
          toolchain_hash="$(printf '%s' "$toolchain" | shasum -a 256 | awk '{ print $1 }')"
          echo "hash=$toolchain_hash" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}-

      - name: Run unit tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test-output.log

      - name: Verify tests executed
        run: grep -Eq "Test run with [1-9][0-9]* tests" test-output.log

      - name: Build executable
        run: swift build
