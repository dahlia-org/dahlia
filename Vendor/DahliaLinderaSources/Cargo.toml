[package]
name = "dahlia-lindera"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
name = "DahliaLindera"
crate-type = ["staticlib"]

[dependencies]
lindera = { version = "=2.0.1", default-features = false, features = ["compress", "embed-ipadic"] }
serde_json = "=1.0.149"
serde_yaml_ng = "=0.10.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "unwind"
strip = "symbols"
