[package]
name = "dahlia-lindera"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
name = "DahliaLindera"
crate-type = ["staticlib"]

[dependencies]
lindera = { version = "=6.2.0", default-features = false, features = ["embed-ipadic"] }
lindera-analysis = { version = "=6.2.0", default-features = false }
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "unwind"
strip = "symbols"
