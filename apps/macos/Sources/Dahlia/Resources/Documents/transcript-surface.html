<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
/* --base, --inset, and --max-width come from the app so the text matches DahliaTypography and the other tabs. */
:root { color-scheme: light dark; --base: 14px; --inset: 24px; --max-width: 880px; font: -apple-system-body; font-size: var(--base); }
body { overflow-anchor: none; margin: 0; background: transparent; color: -apple-system-label; -webkit-font-smoothing: antialiased; }
#rows { max-width: var(--max-width); margin: 0 auto; padding: var(--inset) var(--inset) calc(var(--inset) - 2px); }
/* Off-screen rows skip layout and paint; the browser keeps their last measured height for the scroll bar. */
.row { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; margin-bottom: 2px; content-visibility: auto; contain-intrinsic-size: auto 28px; }
.time { flex: none; font: calc(var(--base) - 2px) ui-monospace, SFMono-Regular, Menlo, monospace; line-height: calc(var(--base) * 1.43); color: -apple-system-tertiary-label; user-select: none; }
.body { flex: 1; min-width: 0; }
.text, .translation { margin: 0; line-height: 1.43; white-space: pre-wrap; overflow-wrap: anywhere; }
.preview .text { color: -apple-system-secondary-label; }
.translation { margin-top: 4px; color: -apple-system-blue; }
.speaker { display: inline-block; margin-right: 8px; padding: 1px 8px; border-radius: 999px; color: white; font-size: calc(var(--base) - 2px); font-weight: 600; user-select: none; }
</style>
<div id="rows"></div>
<script src="transcript-surface.global.js"></script>
</html>
