<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>{{title}} · Dahlia</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafaf9;
      color: #242522;
      --secondary: #656862;
      --status: #347650;
      --status-background: #eaf3ed;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 48px 24px; }
    main { width: 100%; max-width: 640px; text-align: center; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 40px; }
    .brand img { width: 44px; height: 44px; border-radius: 10px; }
    .brand span { font-size: 20px; font-weight: 600; letter-spacing: -.5px; }
    .heading { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .status { display: grid; place-items: center; flex-shrink: 0; width: 36px; height: 36px;
      border-radius: 50%; color: var(--status); background: var(--status-background); }
    .status svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; }
    h1 { margin: 0; font-size: clamp(20px, 4vw, 34px); font-weight: 650; letter-spacing: -.025em; line-height: 1.4; text-wrap: balance; }
    p { margin: 16px auto 0; max-width: 560px; color: var(--secondary); font-size: 16px; line-height: 1.85; text-wrap: balance; }
    [data-state="success"] .failure, [data-state="failure"] .success { display: none; }
    [data-state="failure"] { --status: #b24d3c; --status-background: #faece8; }
    @media (prefers-color-scheme: dark) {
      :root { background: #111210; color: #f2f3ef; --secondary: #a3a79e;
        --status: #9bceaa; --status-background: #203328; }
      [data-state="failure"] { --status: #efaa99; --status-background: #3b2924; }
    }
  </style>
</head>
