services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dahlia
      POSTGRES_PASSWORD: dahlia
      POSTGRES_USER: dahlia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dahlia"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - dahlia-postgres:/var/lib/postgresql/data

volumes:
  dahlia-postgres:
