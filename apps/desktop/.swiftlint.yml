# SwiftLint configuration for Dahlia (macOS app, Swift 6.2)

excluded:
  - .build
  - .swiftpm
  - apps/desktop/BuildTools/.build
  - apps/desktop/BuildTools/.swiftpm
  - DerivedData
  - Package.swift

# ルールの有効化
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

# ルールの無効化
disabled_rules:
  - todo                    # TODO/FIXME コメントは開発中に必要
  - trailing_whitespace     # SwiftFormat に任せる
  - opening_brace           # SwiftFormat に任せる
  - trailing_comma          # SwiftFormat に任せる
  - multiple_closures_with_trailing_closure # SwiftUI の複数 ViewBuilder を優先
  - optional_data_string_conversion # JSONEncoder/Serialization の UTF-8 出力は非失敗で復元する
  - superfluous_disable_command # ルール閾値の見直しで古い局所抑制を無効化しない

# ルールごとの設定
line_length:
  warning: 200
  error: 250
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

type_body_length:
  warning: 2900
  error: 3000

file_length:
  warning: 1810
  error: 2000

function_body_length:
  warning: 165
  error: 200

function_parameter_count:
  warning: 9
  error: 10

type_name:
  min_length: 3
  max_length: 60

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 75
    error: 80
  excluded:
    - id
    - db
    - i
    - x
    - y
    - f
    - t

nesting:
  type_level: 3
  function_level: 3

modifier_order:
  preferred_modifier_order:
    - acl
    - setterACL
    - isolation
    - override
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

large_tuple:
  warning: 4
  error: 5

cyclomatic_complexity:
  warning: 21
  error: 25

reporter: xcode
