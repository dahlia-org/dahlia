<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Notes block handle regression</title>
<style>body { margin: 40px; font: 16px system-ui; } #editor { margin: 24px; }</style>
<pre id="result">Running…</pre><div id="editor"></div>
<script type="module">
// pnpm dev:client -> /tests/browser/document-handles.html. Synthetic content only.
import { mountDocumentEditor } from '../../../../packages/ui/src/documents/editor';
import { DocumentCore } from '../../../../packages/ui/src/documents/core';
import '../../../../packages/ui/src/documents/editor.css';
const core = new DocumentCore();
core.insertText('first\nsecond', () => crypto.randomUUID());
let host = document.querySelector('#editor');
const editor = mountDocumentEditor(host, core.document, true, 'Notes');
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const hover = (x, y) => document.elementFromPoint(x, y).dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: x, clientY: y }));
const visible = () => host.querySelector('.dahlia-block-handle')?.style.display === 'flex';
try {
  editor.commands.setTextSelection({ from: 1, to: 6 });
  const commandB = () => editor.view.dom.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, cancelable: true, key: 'b', code: 'KeyB', keyCode: 66, metaKey: true }));
  commandB();
  assert(editor.view.dom.querySelector('strong')?.textContent === 'first', 'Command+B must make the selected Notes text bold');
  commandB();
  assert(!editor.view.dom.querySelector('strong'), 'Command+B must toggle bold off');
  const first = editor.view.dom.querySelector('p').getBoundingClientRect();
  hover(first.left - 9, first.top + 8);
  assert(visible(), 'Direct gutter hover must show the handle without entering text');
  const handle = host.querySelector('.dahlia-block-handle');
  const second = editor.view.dom.querySelectorAll('p')[1].getBoundingClientRect();
  hover(second.left - 9, second.top + 8);
  assert(visible() && handle.getBoundingClientRect().top >= second.top, 'Moving down the gutter must select the second block');
  host.dispatchEvent(new MouseEvent('mouseleave', { relatedTarget: document.body }));
  assert(!visible(), 'Leaving the host must hide the handle');
  const previousHost = host;
  host = document.createElement('div'); host.id = 'editor';
  previousHost.replaceWith(host); host.append(...previousHost.childNodes);
  editor.setOptions({ element: host }); // Same reparenting as React's EditorContent.
  assert(!previousHost.classList.contains('dahlia-document-host'), 'Reparenting must release the old host');
  hover(first.left - 9, first.top + 8);
  assert(visible(), 'Direct gutter hover must work after React reparents the editor');
  const transfer = new DataTransfer();
  handle.dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: transfer }));
  assert(editor.view.dragging?.node?.node.textContent === 'first', 'Direct gutter entry must drag the first block');
  editor.view.dom.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: transfer, clientX: second.right - 2, clientY: second.bottom - 1 }));
  assert(core.projection().text === 'second\nfirst', 'Dragging from the gutter must move the selected block');
  editor.commands.undo();
  assert(core.projection().text === 'first\nsecond', 'The move must remain undoable');
  editor.commands.selectAll(); editor.commands.toggleBulletList();
  editor.commands.setTextSelection(12); editor.commands.sinkListItem('listItem');
  editor.commands.insertContentAt(editor.state.doc.content.size, { type: 'paragraph', content: [{ type: 'text', text: 'after' }] });
  const nested = editor.view.dom.querySelector('li li');
  assert(nested, 'Fixture must contain a nested list item');
  const list = editor.view.dom.querySelector('ul').getBoundingClientRect();
  const nestedText = nested.querySelector('p').getBoundingClientRect();
  hover(nestedText.left + 2, nestedText.top + 8);
  const listHandle = handle.getBoundingClientRect();
  assert(visible() && listHandle.right <= list.left && listHandle.top < nestedText.top, 'Hovering a list item must show the whole list handle');
  hover(listHandle.left + 9, listHandle.top + 12);
  assert(visible() && handle.getBoundingClientRect().top === listHandle.top, 'Hovering the handle must retain the list');
  handle.dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: new DataTransfer() }));
  assert(editor.view.dragging?.node?.node.type.name === 'bulletList', 'The handle must drag the whole list');
  const dragOver = (x, y) => editor.view.dom.dispatchEvent(new DragEvent('dragover', { bubbles: true, cancelable: true, clientX: x, clientY: y }));
  const indicator = () => host.querySelector('.dahlia-block-drop-indicator')?.getBoundingClientRect();
  const center = () => indicator().top + indicator().height / 2;
  dragOver(nestedText.left + 2, nestedText.top + 4);
  assert(indicator() && center() >= list.bottom - 1, 'The drop indicator must sit between top-level blocks, not inside the list');
  assert(!document.querySelector('.prosemirror-dropcursor-block, .prosemirror-dropcursor-inline'), 'Handle drags must not show the drop cursor, which points inside lists');
  const after = editor.view.dom.querySelector(':scope > p').getBoundingClientRect();
  dragOver(after.left + 2, after.bottom - 1);
  assert(indicator() && Math.abs(center() - after.bottom) <= 1, 'Dragging below the last block must show the indicator at the end');
  editor.view.dom.dispatchEvent(new DragEvent('dragleave', { bubbles: true, clientX: after.left + 2, clientY: after.bottom - 1 }));
  assert(indicator(), 'Crossing elements inside the host must keep the indicator, even without a relatedTarget as in WebKit');
  const outside = new DragEvent('dragover', { bubbles: true, cancelable: true, clientX: 5, clientY: 5 });
  document.querySelector('#result').dispatchEvent(outside);
  assert(!outside.defaultPrevented && !indicator(), 'Dragging outside the editor host must neither accept the drop nor show the indicator');
  editor.view.dom.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, clientX: after.left + 2, clientY: after.bottom - 1 }));
  assert(editor.state.doc.firstChild.textContent === 'after' && editor.state.doc.lastChild.type.name === 'bulletList', 'Dropping must move the whole list');
  assert(!indicator(), 'Dropping must remove the indicator');
  const paragraph = editor.view.dom.querySelector(':scope > p').getBoundingClientRect();
  hover(paragraph.left + 2, paragraph.top + 8);
  handle.dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: new DataTransfer() }));
  assert(editor.view.dragging?.node?.node.textContent === 'after', 'Fixture must drag the paragraph');
  const movedList = editor.view.dom.querySelector('ul').getBoundingClientRect();
  // Chromium ignores dropEffect assignments on a synthetic DataTransfer; observe the handler's assignment.
  const enterTransfer = new DataTransfer();
  Object.defineProperty(enterTransfer, 'dropEffect', { value: 'none', writable: true });
  const enter = new DragEvent('dragenter', { bubbles: true, cancelable: true, dataTransfer: enterTransfer, clientX: paragraph.left + 10, clientY: paragraph.top + 3 });
  editor.view.dom.querySelector(':scope > p').dispatchEvent(enter);
  assert(enter.defaultPrevented && enter.dataTransfer.dropEffect === 'move', 'Entering a text row must accept the move, since WebKit decides on dragenter');
  assert(indicator() && Math.abs(center() - paragraph.top) <= 1, 'The upper half of a text row must target the gap above it');
  dragOver(paragraph.left + 10, paragraph.bottom - 3);
  assert(indicator() && Math.abs(center() - (paragraph.bottom + movedList.top) / 2) <= 1, 'The lower half of a text row must target the gap below it');
  const lower = editor.view.dom.querySelector('li li > p').getBoundingClientRect();
  const gutter = [editor.view.dom.getBoundingClientRect().left - 9, lower.bottom - 1];
  const gutterEvent = (type) => document.elementFromPoint(...gutter).dispatchEvent(new DragEvent(type, { bubbles: true, cancelable: true, clientX: gutter[0], clientY: gutter[1] }));
  gutterEvent('dragover');
  assert(indicator() && center() >= movedList.bottom - 1, 'Dragging down the handle gutter must show the drop indicator');
  gutterEvent('drop');
  assert(editor.state.doc.childCount === 2 && editor.state.doc.lastChild.type.name === 'paragraph', 'A paragraph dropped in the gutter beside a list must land after the list, not inside it');
  const idle = new DragEvent('dragover', { bubbles: true, cancelable: true, clientX: gutter[0], clientY: gutter[1] });
  host.dispatchEvent(idle);
  assert(!idle.defaultPrevented, 'Finishing a drag must stop intercepting drag events');
  editor.setEditable(false);
  hover(first.left - 9, first.top + 8);
  assert(!visible(), 'Read-only editors must not show a handle');
  editor.destroy();
  assert(!host.querySelector('.dahlia-block-handle'), 'Destroy must remove the handle');
  hover(first.left - 9, first.top + 8);
  assert(!visible(), 'Destroy must remove hover listeners');
  document.querySelector('#result').textContent = 'PASS: Command+B bold, direct gutter entry, gutter row change, leave, React reparent, drag/undo, whole-list drag, top-level drop, host-wide drag tracking, text-row halves, gutter drop, read-only, teardown';
} catch (error) { document.querySelector('#result').textContent = `FAIL: ${error.message}`; }
finally { core.destroy(); }
</script>
</html>
