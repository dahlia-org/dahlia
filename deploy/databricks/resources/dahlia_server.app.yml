resources:
  apps:
    dahlia_server:
      name: ${var.app_name}
      description: Dahlia Server backed by Lakebase.
      source_code_path: ../..
      config:
        command: ["corepack", "pnpm", "--filter", "@dahlia-ai/server", "start:databricks"]
        env:
          - name: DAHLIA_AUTH_PROVIDER
            value: header
          - name: DAHLIA_DATABASE_TYPE
            value: lakebase
          - name: DAHLIA_BASE_URL
            value: https://${resources.apps.dahlia_server.url}
          - name: DAHLIA_ADMIN_EMAIL
            value: ${var.admin_email}
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: OPENAI_API_KEY
            value_from: openai_api_key
          - name: OPENAI_BASE_URL
            value: ${var.openai_base_url}
      resources:
        - name: postgres
          postgres:
            branch: ${resources.postgres_projects.dahlia_database_project.id}/branches/production
            database: ${resources.postgres_databases.dahlia_database.id}
            permission: CAN_CONNECT_AND_CREATE
        - name: openai_api_key
          secret:
            scope: ${var.openai_secret_scope}
            key: ${var.openai_secret_key}
            permission: READ
