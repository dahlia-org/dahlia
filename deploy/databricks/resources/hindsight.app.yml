resources:
  apps:
    hindsight:
      name: dahlia-hindsight-${bundle.target}
      description: Hindsight backed by the shared Dahlia Lakebase database.
      # The local cross-encoder reranker needs 4 vCPUs to rerank 300 candidates in about 3.4 seconds.
      compute_size: LARGE
      source_code_path: ../../../apps/hindsight
      config:
        command: ["python", "scripts/start_databricks.py"]
        env:
          - name: HINDSIGHT_API_BASE_PATH
            value: /api
          - name: HINDSIGHT_API_DATABASE_SCHEMA
            value: ${var.hindsight_schema}
          - name: HINDSIGHT_API_TEXT_SEARCH_EXTENSION
            value: lakebase_text
          - name: HINDSIGHT_API_VECTOR_EXTENSION
            value: lakebase_vector
          - name: HINDSIGHT_API_LAKEBASE_TEXT_TOKENIZER
            value: hindsight_lakebase.tokenizer:sudachi
          - name: HINDSIGHT_API_LLM_PROVIDER
            value: databricks
          - name: HINDSIGHT_API_LLM_MODEL
            value: system.ai.gpt-6-luna
          - name: HINDSIGHT_API_VLM_PROVIDER
            value: databricks
          - name: HINDSIGHT_API_VLM_MODEL
            value: ${var.memory_image_model}
          - name: HINDSIGHT_API_LLM_VISION
            value: "true"
          - name: HINDSIGHT_API_LLM_TEMPERATURE_RETAIN
            value: "none"
          - name: HINDSIGHT_API_RETAIN_MAX_ATTACHMENTS_PER_CHUNK
            value: "1"
          - name: HINDSIGHT_API_RETAIN_ATTACHMENT_MAX_COUNT
            value: "8"
          - name: HINDSIGHT_API_RETAIN_ATTACHMENT_MAX_SIZE_MB
            value: "8"
          - name: HINDSIGHT_API_EMBEDDINGS_PROVIDER
            value: databricks
          - name: HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL
            value: system.ai.qwen3-embedding-0-6b
          - name: HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS
            value: ${var.search_embedding_dimensions}
          - name: HINDSIGHT_API_RERANKER_PROVIDER
            value: local
          - name: HINDSIGHT_API_RERANKER_LOCAL_MODEL
            value: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
          - name: HINDSIGHT_API_RERANKER_LOCAL_FORCE_CPU
            value: "true"
          - name: HINDSIGHT_API_RERANKER_MAX_CANDIDATES_LOW
            value: ${var.reranker_max_candidates_low}
          - name: HINDSIGHT_API_RERANKER_MAX_CANDIDATES_MID
            value: ${var.reranker_max_candidates_mid}
          - name: HINDSIGHT_API_RERANKER_MAX_CANDIDATES_HIGH
            value: ${var.reranker_max_candidates_high}
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
      resources:
        - name: postgres
          postgres:
            branch: ${resources.postgres_projects.dahlia_database_project.id}/branches/production
            database: ${resources.postgres_projects.dahlia_database_project.id}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
