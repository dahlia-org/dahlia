resources:
  schemas:
    ops_schema:
      catalog_name: ${var.catalog}
      name: ${var.ops_schema}
      comment: OTel tables for Dahlia Server ${bundle.target}
    ai_schema:
      catalog_name: ${var.catalog}
      name: ${var.ai_schema}
      grants:
        - principal: account users
          privileges:
            - EXECUTE
            - USE_SCHEMA
      comment: AI model services for Dahlia Server
    app_schema:
      catalog_name: ${var.catalog}
      name: ${var.app_schema}
      comment: Resources for Dahlia Server ${bundle.target}

  volumes:
    dahlia_storage:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.app_schema.name}
      name: ${var.volume_name}
      volume_type: MANAGED
      comment: Dahlia Server stored content for ${bundle.target}

  postgres_projects:
    dahlia_database_project:
      project_id: ${var.database_project_id}
      display_name: Dahlia DB ${bundle.target}
      pg_version: 18

  apps:
    dahlia_server:
      name: mcp-dahlia-server-${bundle.target}
      description: Dahlia Server backed by Lakebase.
      compute_size: LARGE
      source_code_path: ../../../apps/server
      user_api_scopes:
        - ai-gateway
        - files
      config:
        command: ["corepack", "pnpm", "start:databricks"]
        env:
          - name: DAHLIA_AUTH_TYPE
            value: header
          - name: DAHLIA_AUTH_PROVIDER_ID
            value: databricks
          - name: DAHLIA_AUTH_SECRET
            value: test-only-better-auth-secret-value
          - name: DAHLIA_AI_BACKEND
            value: databricks
          - name: DATABRICKS_MODEL_SCHEMA
            value: ${var.catalog}.${var.ai_schema}
          - name: DAHLIA_STORAGE_BACKEND
            value: databricks
          - name: DAHLIA_STORAGE_DATABRICKS_VOLUME_PATH
            value: /Volumes/${resources.volumes.dahlia_storage.catalog_name}/${resources.volumes.dahlia_storage.schema_name}/${resources.volumes.dahlia_storage.name}
          - name: DAHLIA_DATABASE_TYPE
            value: lakebase
          - name: DAHLIA_EMBEDDING_MODEL
            value: ${var.catalog}.${var.ai_schema}.qwen3-embedding-0-6b
          - name: DAHLIA_CAPTIONING_MODEL
            value: ${var.catalog}.${var.ai_schema}.gpt-5-6-luna
          - name: DAHLIA_SEARCH_EMBEDDING_DIMENSIONS
            value: ${var.search_embedding_dimensions}
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
      resources:
        - name: postgres
          postgres:
            branch: ${resources.postgres_projects.dahlia_database_project.id}/branches/production
            database: ${resources.postgres_projects.dahlia_database_project.id}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: storage
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${resources.volumes.dahlia_storage.catalog_name}.${resources.volumes.dahlia_storage.schema_name}.${resources.volumes.dahlia_storage.name}
            permission: WRITE_VOLUME
