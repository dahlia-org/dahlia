bundle:
  name: dahlia-server
  databricks_cli_version: ">= 1.4.0"

include:
  - resources/*.yml

sync:
  paths:
    - ../../apps/server

experimental:
  skip_name_prefix_for_schema: true

variables:
  app_name:
    description: Databricks App name.
  database_project_id:
    description: Lakebase project ID.
  admin_email:
    description: Email address that bootstraps Dahlia Server administration.
    default: " "
  catalog:
    description: Unity Catalog catalog containing the storage Volume.
    default: main
  schema:
    description: Unity Catalog schema containing the storage Volume.
  volume_name:
    description: Managed Volume used for Dahlia storage.
    default: storage
targets:
  dev:
    default: true
    mode: development
    variables:
      app_name: dahlia-dev
      database_project_id: dahlia-db-dev
      schema: dahlia_dev
    resources:
      postgres_projects:
        dahlia_database_project:
          purge_on_delete: true

  prod:
    mode: production
    variables:
      app_name: dahlia-prod
      database_project_id: dahlia-db
      schema: dahlia
    resources:
      postgres_projects:
        dahlia_database_project:
          lifecycle:
            prevent_destroy: true
      schemas:
        dahlia:
          lifecycle:
            prevent_destroy: true
      volumes:
        dahlia_storage:
          catalog_name: ${var.catalog}
          schema_name: default
          name: dahlia_artifacts
          lifecycle:
            prevent_destroy: true
        storage:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.dahlia.name}
          name: ${var.volume_name}
          volume_type: MANAGED
          comment: Dahlia Server storage for ${bundle.target}
          lifecycle:
            prevent_destroy: true
