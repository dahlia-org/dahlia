bundle:
  name: dahlia-server
  databricks_cli_version: ">= 1.4.0"

include:
  - resources/*.yml

sync:
  paths:
    - ../../apps/server
    - ../../package.json
    - ../../pnpm-lock.yaml
    - ../../pnpm-workspace.yaml

variables:
  app_name:
    description: Databricks App name.
  database_project_id:
    description: Lakebase project ID.
  admin_email:
    description: Email address that bootstraps Dahlia Server administration.
    default: " "
  artifact_catalog:
    description: Unity Catalog catalog containing the artifact Volume.
    default: main
  artifact_schema:
    description: Unity Catalog schema containing the artifact Volume.
    default: default
  artifact_volume_name:
    description: Managed Volume used for artifact bytes.
targets:
  dev:
    default: true
    mode: development
    variables:
      app_name: dahlia-dev
      database_project_id: dahlia-db-dev
      artifact_volume_name: dahlia_artifacts_dev
    resources:
      postgres_projects:
        dahlia_database_project:
          purge_on_delete: true

  prod:
    mode: production
    variables:
      app_name: dahlia-prod
      database_project_id: dahlia-db
      artifact_volume_name: dahlia_artifacts
    resources:
      postgres_projects:
        dahlia_database_project:
          lifecycle:
            prevent_destroy: true
      volumes:
        dahlia_artifacts:
          lifecycle:
            prevent_destroy: true
