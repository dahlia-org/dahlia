bundle:
  name: dahlia-server
  databricks_cli_version: ">= 1.4.0"

include:
  - resources/*.yml

sync:
  paths:
    - ../../apps/server

experimental:
  skip_name_prefix_for_schema: true

variables:
  app_name:
    description: Databricks App name.
  database_project_id:
    description: Lakebase project ID.
  admin_email:
    description: Email address that bootstraps Dahlia Server administration.
    default: " "
  catalog:
    description: Unity Catalog catalog containing the artifact Volume.
    default: main
  schema:
    description: Unity Catalog schema containing the artifact Volume.
  volume_name:
    description: Managed Volume used for artifact bytes.
    default: artifacts
targets:
  dev:
    default: true
    mode: development
    variables:
      app_name: dahlia-dev
      database_project_id: dahlia-db-dev
      catalog: dahlia_prod_catalog
      schema: dahlia_dev
    resources:
      postgres_projects:
        dahlia_database_project:
          purge_on_delete: true
      volumes:
        dahlia_artifacts:
          catalog_name: ${var.catalog}
          schema_name: default
          name: dahlia_artifacts_dev

  prod:
    mode: production
    variables:
      app_name: dahlia-prod
      database_project_id: dahlia-db
      schema: dahlia
    resources:
      postgres_projects:
        dahlia_database_project:
          lifecycle:
            prevent_destroy: true
      schemas:
        dahlia:
          lifecycle:
            prevent_destroy: true
      volumes:
        dahlia_artifacts:
          catalog_name: ${var.catalog}
          schema_name: default
          name: dahlia_artifacts
          lifecycle:
            prevent_destroy: true
        artifacts:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.dahlia.name}
          name: ${var.volume_name}
          volume_type: MANAGED
          comment: Dahlia Server artifact bytes for ${bundle.target}
          lifecycle:
            prevent_destroy: true
