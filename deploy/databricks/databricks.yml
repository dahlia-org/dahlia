bundle:
  name: dahlia-server
  databricks_cli_version: ">= 1.4.0"

include:
  - resources/*.yml

sync:
  paths:
    - ../../apps/server
    - notebooks

experimental:
  skip_name_prefix_for_schema: true
  scripts:
    postdeploy: "bash scripts/postdeploy.sh '${workspace.profile}' '${var.catalog}' '${var.ai_schema}' '${var.database_project_id}' '${resources.apps.dahlia_server.name}' '${var.catalog}.${resources.schemas.app_schema.name}.auth_secret'"

variables:
  auth_secret_value:
    description: Stable random signing secret of at least 32 characters, supplied through BUNDLE_VAR_auth_secret_value.
  database_project_id:
    description: Lakebase project ID.
  search_embedding_dimensions:
    description: Power-of-two embedding dimensions from 32 through 1024.
    default: "1024"
  catalog:
    description: Unity Catalog catalog containing Dahlia Server storage.
    default: dahlia
  app_schema:
    description: Unity Catalog schema containing Dahlia Server storage.
    default: app
  ai_schema:
    description: Unity Catalog schema containing AI model services.
    default: ai
  ops_schema:
    description: Unity Catalog schema containing OTel tables.
    default: ops
  volume_name:
    description: Managed Volume used for stored content.
    default: storage
targets:
  dev:
    default: true
    mode: development
    variables:
      database_project_id: dahlia-db-dev
    resources:
      postgres_projects:
        dahlia_database_project:
          purge_on_delete: true
  prod:
    mode: production
    variables:
      database_project_id: dahlia-db
    resources:
      postgres_projects:
        dahlia_database_project:
          lifecycle:
            prevent_destroy: true
      schemas:
        ops_schema:
          lifecycle:
            prevent_destroy: true
        ai_schema:
          lifecycle:
            prevent_destroy: true
        app_schema:
          lifecycle:
            prevent_destroy: true
      volumes:
        dahlia_storage:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.app_schema.name}
          name: ${var.volume_name}
          volume_type: MANAGED
          comment: Dahlia Server stored content for ${bundle.target}
          lifecycle:
            prevent_destroy: true
