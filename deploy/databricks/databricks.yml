bundle:
  name: dahlia-server
  databricks_cli_version: ">= 1.4.0"

include:
  - resources/*.yml

sync:
  paths:
    - ../../apps/server

experimental:
  skip_name_prefix_for_schema: true

variables:
  app_name:
    description: Databricks App name.
  database_project_id:
    description: Lakebase project ID.
  admin_email:
    description: Email address that bootstraps Dahlia Server administration.
    default: " "
  catalog:
    description: Unity Catalog catalog used for Dahlia.
  schema:
    description: Unity Catalog schema used for Dahlia Server.
    default: server
  volume_name:
    description: Managed Volume used for Dahlia storage.
    default: storage
  legacy_artifact_catalog:
    description: Existing production catalog retained until artifact bytes are migrated.
    default: main
  legacy_artifact_volume_name:
    description: Existing production Volume retained until artifact bytes are migrated.
    default: dahlia_artifacts

targets:
  dev:
    default: true
    mode: development
    variables:
      app_name: dahlia-dev
      database_project_id: dahlia-db-dev
      catalog: dahlia_dev
    resources:
      postgres_projects:
        dahlia_database_project:
          purge_on_delete: true
  prod:
    mode: production
    variables:
      app_name: dahlia-prod
      database_project_id: dahlia-db
      catalog: dahlia
    resources:
      postgres_projects:
        dahlia_database_project:
          lifecycle:
            prevent_destroy: true
      schemas:
        dahlia:
          catalog_name: ${var.legacy_artifact_catalog}
          name: dahlia
          lifecycle:
            prevent_destroy: true
      volumes:
        dahlia_artifacts:
          catalog_name: ${var.legacy_artifact_catalog}
          schema_name: default
          name: ${var.legacy_artifact_volume_name}
          lifecycle:
            prevent_destroy: true
        artifacts:
          catalog_name: ${var.legacy_artifact_catalog}
          schema_name: ${resources.schemas.dahlia.name}
          name: artifacts
          volume_type: MANAGED
          comment: Legacy Dahlia Server artifact bytes
          lifecycle:
            prevent_destroy: true
