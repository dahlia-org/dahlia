bundle:
  name: dahlia-server
  engine: direct
  databricks_cli_version: ">= 1.4.0"

include:
  - resources/*.yml

sync:
  # The Server App deploys the repository root and builds its pnpm workspace there.
  # Upload only the root manifests, Server, shared UI and the setup notebooks.
  paths:
    - ../../package.json
    - ../../pnpm-workspace.yaml
    - ../../pnpm-lock.yaml
    - ../../turbo.json
    - ../../apps/server
    - ../../packages/ui
    - notebooks

experimental:
  skip_name_prefix_for_schema: true

variables:
  database_project_id:
    description: Lakebase project ID.
  search_embedding_dimensions:
    description: Power-of-two embedding dimensions from 32 through 1024.
    default: "1024"
  catalog:
    description: Unity Catalog catalog containing Dahlia Server storage.
    default: dahlia
  app_schema:
    description: Unity Catalog schema containing Dahlia Server storage.
    default: app
  ops_schema:
    description: Unity Catalog schema containing OTel tables.
    default: ops
  otel_table_prefix:
    description: Prefix of the <prefix>_otel_spans, _otel_logs and _otel_metrics tables in ops_schema.
    default: dahlia
  zerobus_endpoint:
    description: Zerobus OTLP endpoint (https://<workspace-id>.zerobus.<region>.cloud.databricks.com); set after the OTel tables and grants exist. Empty disables export.
    default: ""
  volume_name:
    description: Managed Volume used for stored content.
    default: storage
targets:
  dev:
    default: true
    mode: development
    variables:
      database_project_id: dahlia-db-dev
    resources:
      postgres_projects:
        dahlia_database_project:
          purge_on_delete: true
  prod:
    mode: production
    variables:
      database_project_id: dahlia-db
    resources:
      postgres_projects:
        dahlia_database_project:
          lifecycle:
            prevent_destroy: true
      schemas:
        ops_schema:
          lifecycle:
            prevent_destroy: true
        app_schema:
          lifecycle:
            prevent_destroy: true
      volumes:
        dahlia_storage:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.app_schema.name}
          name: ${var.volume_name}
          volume_type: MANAGED
          comment: Dahlia Server stored content for ${bundle.target}
          lifecycle:
            prevent_destroy: true
